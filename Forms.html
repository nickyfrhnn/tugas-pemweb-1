<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="/proses" method="post">
    <h1>Formulir Pendaftaran</h1>
    <label for="nama">Nama lengkap:</label><br>
    <input type="text" id="Nama" name="Nama" placeholder="Masukan Nama" required><br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" placeholder="Masukan email" required><br><br>

    <label for="sandi">Kata Sandi:</label><br>
    <input type="password" id="sandi" name="sandi" placeholder="Masukan Kata sandi" required><br><br>
     
    <label for="Tanggal">Tanggal Lahir</label><br>
    <input type="date" id="Tanggal"> 

    <p>Jenis Kelamin</p>
    <input type="radio" id="pria" name="Gender" value="pria">
    <label for="pria">Laki-laki</label><br>

    <input type="radio" id="Wania" name="Gender" value="Wanita">
    <label for="Wanita">Perempuan</label><br>

    <p>Hobi :</p>
    <input type="checkbox" id="Coding" name="Hobi" value="Coding>
    <label for="Coding">Coding </label><br>

    <input type="checkbox" id="Gaming" name="Hobi" value="Gaming">
    <label for="Gaming">Gaming</label><br>

    <input type="checkbox" id="Editing" name="Hobi" value="Editing">
    <label for="Editing">Editing</label><br><br>

    <label for="jurusan">Jurusan:</label><br>
        <select id="jurusan" name="jurusan"> 
            <option value="">-- Pilih Jurusan --</option> 
            <option value="tkj">TKJ</option> 
            <option value="rpl">RPL</option> 
        </select><br><br> 
    
    <label for="Alamat"> Alamat</label><br>
    <textarea placeholder="Masukan Alamat Anda">
    </textarea><br><br>

    <label for="Foto"> Foto</label><br>
    <input type="file"><br><br>

    <label for="Website"> Website :</label><br>
    <input type="text" placeholder="https://example.com"><br><br>

    <button type="button"> Kirim</button>
    <button type="button"> Reset</button>
    </form>
    
</body>
</html>
